camera_params:
  #min_angle : -0.2617993877991494
  #max_angle : 0.2617993877991494
    min_angle : -0.08726646259971647
    max_angle : 0.08726646259971647
    min_visual_distance : 0.5
    max_visual_distance : 5

rf_params:
    map_granularity_not_used : 0.5
    map_height : 2.5
    angle_delta : 0.017453292519943295
    dist_delta: 0.1

bel_params:
  torch_device: 'cuda:3'
  akld_hist_len: 50
  akld_append_interval: 5
  akld_stop: 5.0
  visualize: false
  explore_stop: "ENTROPY"
  avg_ent_stop: 0.2

planner_params:
  max_time: 120 #30
    #mcts_step_length: 1.0
  mcts_step_length: 0.5
  mcts_step_deg: 15
  max_observations: 1
  max_time_wo_replan: 500
  way_point_loc_acc: 0.1
  carrot_loc_acc: 0.075
  way_point_ang_acc: 0.15
  way_point_direction_angle: 0.15
  teleport: true
  max_rollout_depth: 100
  epsilon: 0.1
  max_num_samples: 100
  sample_discretization: 100
  angle_sample_discretization: 45

observation_calc_params:
  dne_occluded_prob: 0.35
  prob_occ_given_obs_free: 0.01
  occluded_percent_to_ignore: 0.5
  use_model_score: false
  prob_correct_given_observed: 0.999
