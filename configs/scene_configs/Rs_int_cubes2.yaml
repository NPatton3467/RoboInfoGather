    #orientation: [0,0,0,1]
    #rgba: [1, 0, 0, 1.0]
    #scale: [0.2,0.2,0.2]

robots:
  - type: Turtlebot
    name: rob
    obs_modalities: [scan, rgb, depth, depth_linear, occupancy_grid] # , seg_instance, seg_semantic, bbox_3d]
    scale: 1.0
    self_collision: false
    action_normalize: true
    action_type: continuous
    visible: false
    controller_config:
      base:
        name: DifferentialDriveController
    sensor_config:
      VisionSensor:
        enabled: True
        sensor_kwargs:
          image_height: 1000
          image_width: 1000
      
task:
  type: DummyTask
  #robot_idn: 0
