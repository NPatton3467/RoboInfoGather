Examples:
  - name: Task 1
    prompt: How many cups are there? 
    program: |
        program = Count(
            query=Query(
                obj_tp="cups", where_clause=WhereClause(where_tp="true", obj_tp="cups")
            ),
            obj_tp="cups",
        )
    
  - name: Task 2
    prompt: Find the location of my tallest cup.
    program: |
        program = Map(
            obj_tp="Cup",
            map_feature="location",
            query=Query(
                obj_tp="Cup",
                where_clause=WhereClause(where_tp="max", obj_tp="cup", scalar_feature="height"),
            ),
            map_tp="feature_enum",
        )

  - name: Task 3
    prompt: Find the location of an empty conference room with a whiteboard in it.
    program: |
        sub_where1 = WhereClause(
            where_tp="not",
            obj_tp="Conference Room",
            sub_where_clause=[
                WhereClause(
                    where_tp="spatial_rel",
                    obj_tp="Conference Room",
                    obj_tp2="Human",
                    spatial_relation="inside",
                )
            ],
        )
        sub_where2 = WhereClause(
            where_tp="spatial_rel",
            obj_tp="Conference Room",
            obj_tp2="White Board",
            spatial_relation="inside",
        )
        program = Map(
            obj_tp="Conference Room",
            map_feature="location",
            query=Query(
                obj_tp="Conference Room",
                where_clause=WhereClause(
                    where_tp="and",
                    obj_tp="Conference Room",
                    sub_where_clause=[sub_where1, sub_where2],
                ),
            ),
            map_tp="feature_enum",
        )
  - name: Task 4
    prompt: Is my blanket folded on the couch?
    program: |
        sub_where1 = WhereClause(
            where_tp="spatial_rel",
            obj_tp="Blanket",
            obj_tp2="Couch",
            spatial_relation="on",
        )
        sub_where2=WhereClause(where_tp="feature_enum", obj_tp="Blanket", enum_feature="fold status", enum_param="folded")
        program = Map(
            obj_tp="Blanket",
            map_feature="fold status",
            query=Query(
                obj_tp="Blanket",
                where_clause=WhereClause(
                    where_tp="and",
                    obj_tp="Blanket",
                    sub_where_clause=[sub_where1, sub_where2],
                ),
            ),
            map_tp="feature_enum",
        )
  - name: Task 5
    prompt: Is my blanket folded on the couch in the bedroom?
    program: |
        sub_where1 = WhereClause(
            where_tp="spatial_rel",
            obj_tp="Blanket",
            obj_tp2="Couch",
            spatial_relation="on",
        )
        sub_where2 = WhereClause(
            where_tp="spatial_rel",
            obj_tp="Blanket",
            obj_tp2="Bedroom",
            spatial_relation="in",
        )
        sub_where3=WhereClause(where_tp="feature_enum", obj_tp="Blanket", enum_feature="fold_status", enum_param"folded")
        sub_where12 = WhereClasue(where_tp="and", obj_tp="Blanket", sub_where_clause=[sub_where1, sub_where2])
        program = Map(
            obj_tp="Blanket",
            map_feature="fold_status",
            query=Query(
                obj_tp="Blanket",
                where_clause=WhereClause(
                    where_tp="and",
                    obj_tp="Blanket",
                    sub_where_clause=[sub_where12, sub_where3],
                ),
            ),
            map_tp="feature_enum",
        )
